name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: this workflow only reads the repo.
permissions:
  contents: read

# A new push to the same branch cancels the old run instead of queueing.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          # The backend has its own lockfile; without this, setup-node looks
          # for package-lock.json at the repo root and the cache silently
          # does nothing.
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        # npm ci installs exactly what the lockfile says and fails if
        # package.json and package-lock.json disagree. npm install can drift.
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
